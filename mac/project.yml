name: Spoof
options:
  bundleIdPrefix: com.danielrltan
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Spoof:
    type: application
    platform: macOS
    sources:
      - path: Spoof
        excludes: [AppIcon.icon]
      - path: Spoof/AppIcon.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielrltan.spoof
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ARCHS: arm64
        INFOPLIST_KEY_CFBundleDisplayName: Spoof
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSLocationUsageDescription: Trips on real GPS start from where you are; the plugged-in iPhone is next to this Mac.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Trips on real GPS start from where you are; the plugged-in iPhone is next to this Mac.
